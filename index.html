<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legal · ANVL Coaching</title>
<meta name="description" content="Privacy policy and account deletion for the ANVL Coaching app.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600&display=swap">
<style>
:root{--canvas:#0B0D0F;--surface:#1B1F23;--text:#F2F4F5;--text2:#A7B0B8;--muted:#6F7A86;--olive:#A3B344;--rule:rgba(255,255,255,0.08)}
*{box-sizing:border-box}
html{background:var(--canvas)}
body{margin:0;background:var(--canvas);color:var(--text);font:16px/1.65 Inter,"Helvetica Neue",Arial,sans-serif;padding-block:48px 96px;padding-inline:20px;-webkit-font-smoothing:antialiased}
[dir=rtl] body,[dir=rtl]{font-family:"Noto Sans Arabic","Segoe UI",Tahoma,sans-serif}
main{max-width:680px;margin:0 auto}
.mark{font-family:"Bebas Neue",Impact,sans-serif;font-size:22px;letter-spacing:.08em;color:var(--olive);text-decoration:none}
h1{font-family:"Bebas Neue",Impact,sans-serif;font-weight:400;font-size:44px;line-height:1.05;letter-spacing:.01em;margin:18px 0 8px;text-wrap:balance}
[dir=rtl] h1{font-family:"Noto Sans Arabic",sans-serif;font-weight:700;font-size:32px;letter-spacing:0}
h2{font-size:15px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text);margin:40px 0 10px}
[dir=rtl] h2{letter-spacing:0;text-transform:none;font-size:18px}
p,li{color:var(--text2);max-width:65ch}
ul{padding-inline-start:1.2em}
li{margin:6px 0}
a{color:var(--olive)}
.meta{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
nav.langs{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:14px}
nav.langs a{color:var(--muted);text-decoration:none}
nav.langs a[aria-current]{color:var(--text)}
.steps{display:grid;gap:12px;margin:18px 0 8px;padding:0;list-style:none}
.steps li{background:var(--surface);border-radius:12px;padding:14px 16px;margin:0;color:var(--text)}
.button{display:inline-block;margin-top:8px;background:var(--olive);color:#0B0D0F;font-weight:600;text-decoration:none;padding:12px 20px;border-radius:8px}
footer{margin-top:56px;padding-top:18px;border-top:1px solid var(--rule);color:var(--muted);font-size:14px}
</style>
</head>
<body>
<main>
<span class="mark">ANVL</span>
<h1>ANVL Coaching</h1>
<p>Privacy policy and account deletion for the ANVL Coaching app.</p>
<ul class="steps">
<li><a href="privacy/">Privacy policy</a> · <a href="privacy/fr/" lang="fr">FR</a> · <a href="privacy/ar/" lang="ar">AR</a></li>
<li><a href="delete-account/">Delete your ANVL Coaching account</a> · <a href="delete-account/fr/" lang="fr">FR</a> · <a href="delete-account/ar/" lang="ar">AR</a></li>
</ul>
<footer>ANVL Coaching is operated by Georges Joseph Maalouf, Zahle, Bekaa, Lebanon. <a href="mailto:support@anvlathletics.com">support@anvlathletics.com</a></footer>
</main>
</body>
</html>
