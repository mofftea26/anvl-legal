<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ANVL Coaching</title>
<style>
:root{--canvas:#0B0D0F;--surface:#1B1F23;--text:#F2F4F5;--text2:#A7B0B8;--muted:#6F7A86;--olive:#A3B344;--rule:rgba(255,255,255,0.08)}
*{box-sizing:border-box}
html{background:var(--canvas)}
body{margin:0;background:var(--canvas);color:var(--text);font:16px/1.65 Inter,"Helvetica Neue",Arial,sans-serif;padding-block:48px 96px;padding-inline:20px;-webkit-font-smoothing:antialiased}
[dir=rtl] body,[dir=rtl]{font-family:"Noto Sans Arabic","Segoe UI",Tahoma,sans-serif}
main{max-width:680px;margin:0 auto}
.mark{font-family:"Bebas Neue",Impact,sans-serif;font-size:22px;letter-spacing:.08em;color:var(--olive);text-decoration:none}
h1{font-family:"Bebas Neue",Impact,sans-serif;font-weight:400;font-size:44px;line-height:1.05;letter-spacing:.01em;margin:18px 0 8px;text-wrap:balance}
[dir=rtl] h1{font-family:"Noto Sans Arabic",sans-serif;font-weight:700;font-size:32px;letter-spacing:0}
h2{font-size:15px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text);margin:40px 0 10px}
[dir=rtl] h2{letter-spacing:0;text-transform:none;font-size:18px}
p,li{color:var(--text2);max-width:65ch}
ul{padding-inline-start:1.2em}
li{margin:6px 0}
a{color:var(--olive)}
.meta{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
nav.langs{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:14px}
nav.langs a{color:var(--muted);text-decoration:none}
nav.langs a[aria-current]{color:var(--text)}
.steps{display:grid;gap:12px;margin:18px 0 8px;padding:0;list-style:none}
.steps li{background:var(--surface);border-radius:12px;padding:14px 16px;margin:0;color:var(--text)}
.button{display:inline-block;margin-top:8px;background:var(--olive);color:#0B0D0F;font-weight:600;text-decoration:none;padding:12px 20px;border-radius:8px}
footer{margin-top:56px;padding-top:18px;border-top:1px solid var(--rule);color:var(--muted);font-size:14px}

.hop .button{display:block;text-align:center;margin-top:14px;padding:14px 20px}
.hop .quiet{background:var(--surface);color:var(--text)}
.hop .code{font:600 22px/1.3 ui-monospace,Menlo,monospace;letter-spacing:.06em;color:var(--text);font-variant-numeric:tabular-nums;margin:6px 0 0;user-select:all;-webkit-user-select:all}
.hop .label{margin:32px 0 0;font-size:14px;color:var(--muted)}
</style>
<script>
(function () {
  var plan = (function hopPlan(place) {
    const listing = 'https://play.google.com/store/apps/details?id=com.anvlcoaching.app';
    const code = place.hash
        .replace(/^#/, '')
        .toUpperCase()
        .replace(/[^0-9A-Z]/g, '')
        .slice(0, 16);
    const dev = /(?:^\?|&)d(?:=|&|$)/.test(place.search);
    const scheme = dev ? 'anvl-dev' : 'anvl';
    const pkg = dev ? 'com.anvlcoaching.app.dev' : 'com.anvlcoaching.app';
    // The code rides through a Play install as the install referrer (C20, R50).
    const store = code.length > 0 ? `${listing}&referrer=${encodeURIComponent(`code=${code}`)}` : listing;
    // An iPad's Safari says "Macintosh" and nothing of iPad: a Mac that can be touched is an iPad.
    const apple = /iphone|ipad|ipod/i.test(place.userAgent) ||
        (/macintosh/i.test(place.userAgent) && (place.touchPoints ?? 0) > 1);
    if (apple) {
        // The app's Apple ID (App Store Connect › App Information). `appStoreLive` turns true the day
        // the listing is on the App Store: until then the store answers "unavailable", so no button.
        const appStoreId = '6835370266';
        const appStoreLive = false;
        const french = /^fr/i.test(place.language ?? '');
        const shown = appStoreLive && !dev;
        // As ANVL draws a code: seven characters whole, eight in two fours.
        const drawn = code.length === 0 ? '' : `ANVL-${code.length === 8 ? `${code.slice(0, 4)}-${code.slice(4)}` : code}`;
        const name = dev ? 'ANVL Dev' : 'ANVL';
        return {
            kind: 'apple',
            open: code.length > 0 ? `${scheme}://join/${code}` : null,
            store: shown ? `https://apps.apple.com/app/id${appStoreId}` : null,
            code: drawn,
            lang: french ? 'fr' : 'en',
            text: french
                ? {
                    title: code.length > 0 ? `Ouvrir cette invitation dans ${name}` : name,
                    body: dev
                        ? 'ANVL Dev s’installe depuis un lien de build, pas depuis l’App Store.'
                        : shown
                            ? 'Si ANVL n’est pas encore sur cet iPhone, installez-le depuis l’App Store.'
                            : 'ANVL pour iPhone arrive bientôt sur l’App Store.',
                    open: `Ouvrir ${name}`,
                    store: 'Voir dans l’App Store',
                    code: `Après l’installation, saisissez ce code dans ${name}.`,
                }
                : {
                    title: code.length > 0 ? `Open this invitation in ${name}` : name,
                    body: dev
                        ? 'ANVL Dev is installed from a build link, not from the App Store.'
                        : shown
                            ? 'If ANVL is not on this iPhone yet, get it from the App Store.'
                            : 'ANVL for iPhone is coming to the App Store soon.',
                    open: `Open ${name}`,
                    store: 'View in the App Store',
                    code: `After installing, enter this code in ${name}.`,
                },
        };
    }
    if (code.length === 0 || !/android/i.test(place.userAgent))
        return { kind: 'forward', url: store };
    return {
        kind: 'forward',
        url: `intent://join/${code}#Intent;scheme=${scheme};package=${pkg};S.browser_fallback_url=${encodeURIComponent(store)};end`,
    };
})({
    hash: location.hash,
    search: location.search,
    userAgent: navigator.userAgent,
    touchPoints: navigator.maxTouchPoints,
    language: navigator.language,
  });
  if (plan.kind === 'forward') {
    location.replace(plan.url);
    return;
  }
  // An iPhone or iPad: drawn with textContent only, so nothing from the address is ever markup.
  document.addEventListener('DOMContentLoaded', function () {
    document.documentElement.lang = plan.lang;
    var main = document.createElement('main');
    main.className = 'hop';
    function add(tag, cls, text, href) {
      var el = document.createElement(tag);
      if (cls) el.className = cls;
      el.textContent = text;
      if (href) el.setAttribute('href', href);
      main.appendChild(el);
      return el;
    }
    add('span', 'mark', 'ANVL');
    add('h1', '', plan.text.title);
    add('p', '', plan.text.body);
    if (plan.open) add('a', 'button', plan.text.open, plan.open);
    if (plan.store) add('a', plan.open ? 'button quiet' : 'button', plan.text.store, plan.store);
    if (plan.code) {
      add('p', 'label', plan.text.code);
      add('p', 'code', plan.code);
    }
    document.body.appendChild(main);
  });
})();
</script>
</head>
<body></body>
</html>
